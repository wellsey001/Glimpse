name: Build APK

# Builds an installable APK on GitHub's servers whenever you push to main
# (or when you press "Run workflow" on the Actions tab), checks it, and
# publishes it on the repository's Releases page so you can install it
# straight from your phone.
on:
  push:
    branches: [main]
    # Text-only changes (like this README) don't need a new APK.
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/release.jks
          else
            echo "::warning::Signing secrets not set: this APK uses a temporary key and won't install over earlier versions."
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Glimpse.apk

      - name: Check the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "== Signature =="
          "$BT/apksigner" verify --verbose --print-certs Glimpse.apk
          echo "== Package info =="
          "$BT/aapt" dump badging Glimpse.apk | grep -E "package:|sdkVersion|targetSdkVersion|native-code|application-label:"

      - uses: actions/upload-artifact@v4
        with:
          name: Glimpse-apk
          path: Glimpse.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.${{ github.run_number }}"
          gh release create "$TAG" Glimpse.apk \
            --title "Glimpse $TAG" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone, tap Glimpse.apk below to download and install." \
            --latest
