name: Build APK

# Builds an installable APK on GitHub's servers whenever you push,
# or when you press "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Glimpse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Glimpse-apk
          path: Glimpse.apk
